# CacheCollapse reverse proxy — the single public entry point (port 80 -> 8080).
# Routes the browser to the dashboard, API calls to the backend, and the live
# feed/controls to the monitor.

# Use all CPU cores and allow many connections, so the attacker's connection flood
# cannot starve legitimate visitors of a free Nginx worker slot.
worker_processes auto;

events { worker_connections 8192; }

http {
    # Static-case rate-limit zone (the "production" version of the defense).
    # The dashboard's live toggle uses the app-layer limiter in the backend;
    # this zone is here to show the standard nginx approach as well.
    limit_req_zone $binary_remote_addr zone=api_rl:10m rate=50r/s;

    # Keep connections to the backend open and reuse them (far less setup cost).
    upstream backend  { server backend:5000; keepalive 64; }
    upstream frontend { server frontend:80; keepalive 16; }
    upstream monitor  { server monitor:7000; }

    server {
        listen 80;

        # The custom live dashboard. no-store so a refresh always gets the latest.
        location / {
            proxy_pass http://frontend;
            add_header Cache-Control "no-store";
        }

        # The product API. /api/products/1 -> backend /products/1
        location /api/ {
            # Forward the REAL client address so rate limiting buckets each client
            # separately (attacker vs real shoppers).
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            # EDGE rate limiting: this file is rewritten + Nginx reloaded live when
            # the dashboard "Rate limiting" toggle changes. When on, the attacker's
            # flood is rejected HERE, before it can congest the backend or the proxy.
            include /etc/nginx/dynamic/ratelimit.conf;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://backend/;
        }

        # Live metrics stream (Server-Sent Events) + control buttons.
        location /live {
            proxy_pass http://monitor/live;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_buffering off;         # required for SSE
            chunked_transfer_encoding off;
            proxy_read_timeout 1h;
        }
        location /control/ {
            proxy_pass http://monitor/control/;
        }
    }
}
